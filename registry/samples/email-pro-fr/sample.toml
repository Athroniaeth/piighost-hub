schema_version = 1

[sample]
name = "email-pro-fr"
title = { en = "Business email (French)", fr = "E-mail professionnel (français)" }
tags = ["fr", "lang-fr", "customer-support", "chat"]
text = """
Objet : relance dossier 732 829 320 00074 - prélèvement rejeté

Bonjour,

Je suis Patrick Dupont, client chez vous depuis mars 2019, et je me permets de
relancer après un premier message resté sans réponse la semaine dernière.

Le prélèvement du 5 du mois n'est pas passé sur mon compte
FR76 3000 6000 0112 3456 7890 189. Ma banque m'indique que l'ordre a bien été
présenté mais rejeté pour un motif qu'elle ne peut pas me détailler. Je n'ai
reçu aucun avis de votre côté, et je découvre ce matin une pénalité de retard
sur mon espace client.

Mon dossier porte le numéro 732 829 320 00074, au nom de la société. Vous
pouvez me joindre au 06 39 98 12 34 en journée, ou par retour de mail à
patrick.dupont@example.com. Je suis joignable plus facilement l'après-midi.

L'adresse de facturation n'a pas changé : 12 rue des Lilas, 75008 Paris. Si
vous avez besoin d'un RIB à jour ou d'une attestation de ma banque, dites-le
moi, je vous les envoie dans la journée.

Merci de me confirmer la levée de la pénalité une fois le point réglé.

Cordialement,
Patrick Dupont
"""

