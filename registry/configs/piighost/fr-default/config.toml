schema_version = 1

[config]
name = "fr-default"
description = { en = "French text without a model: extended French and EU shapes plus the generic ones, with whole-word expansion so a value detected once is caught everywhere in the message.", fr = "Texte français sans modèle : formes françaises et européennes étendues plus les génériques, avec expansion par mot entier pour qu'une valeur détectée une fois soit reprise partout dans le message." }
tags = ["fr", "eu", "lang-fr", "chat", "document", "customer-support"]
piighost = ">=1.7,<2"

[[detectors]]
name = "regex-fr"
type = "regex"
groups = ["piighost/fr-extended"]

[[detectors]]
name = "regex-eu"
type = "regex"
groups = ["piighost/eu-extended"]

[[detectors]]
name = "regex-generic"
type = "regex"
groups = ["piighost/generic"]

[stages.linker]
type = "exact"

[stages.expander]
type = "word_boundary"

[stages.anonymizer.placeholder]
type = "label_counter"
