schema_version = 1

[config]
name = "support-en"
description = { en = "English support conversations: US and international shapes with a local model for names and companies, and a guard that refuses a reply still holding a clear email address. The guard costs a second detection pass and is worth it on a channel an agent forwards.", fr = "Conversations de support en anglais : formes américaines et internationales avec un modèle local pour les noms et sociétés, et un guard qui refuse une réponse contenant encore une adresse e-mail en clair. Le guard coûte une seconde passe de détection et le vaut sur un canal qu'un agent transfère." }
tags = ["us", "international", "lang-en", "customer-support", "chat", "tool-agent"]
piighost = ">=1.7,<2"

[[extends]]
ref = "piighost/ner-base"

[[detectors]]
name = "regex-us"
type = "regex"
groups = ["piighost/us-extended"]

[[detectors]]
name = "regex-generic"
type = "regex"
groups = ["piighost/generic"]

[stages.expander]
type = "word_boundary"

[stages.guard]
type = "detector"

[stages.guard.detector]
type = "regex"
patterns = { EMAIL = '(?<![A-Za-z0-9._%+-])[A-Za-z0-9._%+-]+@(?:[A-Za-z0-9-]+\.)+[A-Za-z]{2,}' }
