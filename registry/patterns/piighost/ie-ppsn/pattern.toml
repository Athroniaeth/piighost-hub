schema_version = 1

[pattern]
name = "ie-ppsn"
label = "IE_PPSN"
tags = ["ie", "government-id", "identity", "hr"]
regex = '(?<!\w)\d{7}[A-Z][A-IW]?(?!\w)'

[pattern.description]
en = "Irish personal public service number: seven digits, one check letter, and for numbers issued from January 2013 an optional second letter in the range A to I or W. Purview documents both the old form, seven digits and one or two letters, and the new one; Cloudflare publishes 1234567FA as its sample. The check letter is not verified, the match is on shape alone. The seven digit head keeps this clear of the nine and ten digit crowd, and no registry label fired on the examples."
fr = "Numero de service public personnel irlandais : sept chiffres, une lettre de controle, et pour les numeros emis depuis janvier 2013 une seconde lettre facultative de A a I ou W. Purview documente l'ancienne forme, sept chiffres et une ou deux lettres, ainsi que la nouvelle ; Cloudflare publie 1234567FA comme exemple. La lettre de controle n'est pas verifiee, la reconnaissance porte sur la forme seule. La tete a sept chiffres tient ce motif a l'ecart de la foule des neuf et dix chiffres, et aucun label du registre ne s'est declenche sur les exemples."

[[examples.match]]
text = "The PPS number 1234567FA is printed on the payslip."
value = "1234567FA"

[[examples.match]]
text = "Revenue holds 7654321T for the same person."
value = "7654321T"

[[examples.no_match]]
text = "123456FA"

[[examples.no_match]]
text = "1234567"

[[examples.no_match]]
text = "1234567fa"

[redos]
prefix = ""
filler = "1234567"
suffix = "x"
