schema_version = 1

[pattern]
name = "at-svnr"
label = "AT_SVNR"
tags = ["at", "government-id", "identity", "hr"]
regex = '(?<!\w)\d{4} ?(?:0[1-9]|[12]\d|3[01])(?:0[1-9]|1[0-2])\d{2}(?!\w)'

[pattern.description]
en = "Austrian social security number, the Sozialversicherungsnummer: ten digits, a three digit serial and one check digit, then the birth date as DDMMYY, per the Purview Austria social security definition; the card and the Cloudflare sample print it with a space after the fourth digit, as in 1018 010180. The day and month ranges are enforced, the check digit is not. Reproduced collision: written without the space the ten digit run is matched whole by UK_NHS, by US_NPI when it starts with a one or a two, and by BR_PHONE; and a ten digit run that starts from six to nine is matched whole by IN_PHONE as well, reproduced on 6234150367. With the space it stays clear of those but DE_PHONE still matches a leading part."
fr = "Numero de securite sociale autrichien, la Sozialversicherungsnummer : dix chiffres, un numero de serie de trois chiffres et une cle, puis la date de naissance en JJMMAA, selon la definition Purview du numero autrichien ; la carte et l'exemple Cloudflare l'impriment avec une espace apres le quatrieme chiffre, comme dans 1018 010180. Les plages de jour et de mois sont imposees, la cle ne l'est pas. Collision reproduite : sans l'espace, la suite de dix chiffres est reconnue en entier par UK_NHS, par US_NPI lorsqu'elle commence par un ou deux, et par BR_PHONE ; et une suite de dix chiffres commencant de six a neuf est aussi reconnue en entier par IN_PHONE, verifie sur 6234150367. Avec l'espace elle echappe a ces labels, mais DE_PHONE en reconnait encore une partie initiale."

[[examples.match]]
text = "Die Sozialversicherungsnummer 1018 010180 steht auf der Karte."
value = "1018 010180"

[[examples.match]]
text = "The number 1234150367 is the same layout written solid."
value = "1234150367"

[[examples.no_match]]
text = "1018 011380"

[[examples.no_match]]
text = "101801018"

[[examples.no_match]]
text = "1018-010180"

[redos]
prefix = ""
filler = "1018 0101"
suffix = "x"
