schema_version = 1

[pattern]
name = "fr-phone"
label = "FR_PHONE"
tags = ["fr", "contact"]
regex = '(?<!\d)(?:\+33|0)[1-9](?:[\s.-]?\d{2}){4}(?!\d)'

[pattern.description]
en = "French phone number: +33 or a leading 0, one non-zero digit, then four pairs of digits separated by optional spaces, dots or hyphens. Lookarounds replace \\b so the + prefix anchors properly. The +33 form only matches when the first digit follows immediately (+33639981234), not '+33 6 39...'."
fr = "Numéro de téléphone français : +33 ou un 0 initial, un chiffre non nul, puis quatre paires de chiffres séparées par des espaces, points ou tirets optionnels. Des lookarounds remplacent \\b pour ancrer correctement le préfixe +. La forme +33 ne correspond que si le premier chiffre suit immédiatement (+33639981234), pas « +33 6 39... »."


# 06 39 98 xx xx et 01 99 00 xx xx : tranches réservées à la fiction par l'ARCEP.
[[examples.match]]
text = "Appelez le 06 39 98 12 34 demain."
value = "06 39 98 12 34"

[[examples.match]]
text = "Joignable au +33639981234 en journée."
value = "+33639981234"

[[examples.match]]
text = "Standard : 01.99.00.12.34"
value = "01.99.00.12.34"

# Quatre groupes seulement.
[[examples.no_match]]
text = "06 39 98 12"

# Un chiffre de trop : refusé par le lookahead.
[[examples.no_match]]
text = "0639981234567"

[redos]
prefix = "06 39 98 "
filler = "1 "
suffix = "x"
