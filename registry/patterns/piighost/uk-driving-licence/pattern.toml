schema_version = 1

[pattern]
name = "uk-driving-licence"
label = "UK_DRIVING_LICENCE"
tags = ["uk", "government-id", "identity"]
regex = '(?<!\w)[A-Z9]{5}\d(?:0[1-9]|1[0-2]|5[1-9]|6[0-2])(?:0[1-9]|[12]\d|3[01])\d[A-Z9]{2}[A-Z0-9][A-Z]{2}(?!\w)'

[pattern.description]
en = "DVLA driver number, sixteen characters that encode the holder: five characters of surname padded with nines, the decade digit of the birth year, the birth month raised by fifty for a female holder, the birth day, the last year digit, two initials or nines, one arbitrary character and two check letters. Taken from the Presidio UK driving licence recognizer, which follows the DVLA layout; Purview describes the same run plus the two digit issue number that the card prints after it, and those eighteen character forms are deliberately not matched here. The embedded month and day ranges make this one of the most selective shapes in the batch. No registry label was seen to fire on the examples."
fr = "Numero de conducteur DVLA, seize caracteres qui encodent le titulaire : cinq caracteres de nom complete par des neuf, le chiffre de la decennie de naissance, le mois de naissance augmente de cinquante pour une femme, le jour, le dernier chiffre de l'annee, deux initiales ou des neuf, un caractere arbitraire et deux lettres de controle. Repris du recognizer Presidio du permis britannique, conforme a la mise en page de la DVLA ; Purview decrit la meme suite suivie du numero d'emission a deux chiffres imprime sur la carte, et ces formes a dix-huit caracteres ne sont volontairement pas reconnues ici. Les plages de mois et de jour incorporees en font l'une des formes les plus selectives du lot. Aucun label du registre ne s'est declenche sur les exemples."

[[examples.match]]
text = "The DVLA driver number DOE99901015AB9CD sits in field five of the card."
value = "DOE99901015AB9CD"

[[examples.match]]
text = "Record DOE99651015AB9CD raises the month by fifty for a female holder."
value = "DOE99651015AB9CD"

[[examples.no_match]]
text = "DOE99901015AB9C"

[[examples.no_match]]
text = "DOE99913015AB9CD"

[[examples.no_match]]
text = "doe99901015ab9cd"

[redos]
prefix = ""
filler = "DOE999010"
suffix = "!"
