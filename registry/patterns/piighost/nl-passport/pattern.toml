schema_version = 1

[pattern]
name = "nl-passport"
label = "NL_PASSPORT"
tags = ["nl", "government-id", "identity"]
regex = '(?<!\w)[A-NP-Z]{2}[A-NP-Z0-9]{6}\d(?!\w)'

[pattern.description]
en = "Dutch travel document number, nine characters. RvIG, the issuing authority, states that positions one and two are letters, positions three to eight are letters or digits and position nine is a digit, and that the letter O is never used so it cannot be confused with the digit zero; the digit zero itself has been dropped from documents issued since December 2019 but older documents still carry it, so zero is still accepted here. Purview only says nine letters or digits, which would match any nine character token, so the authority reading is used instead. No registry label fired on the examples."
fr = "Numero de document de voyage neerlandais, neuf caracteres. La RvIG, autorite emettrice, indique que les positions un et deux sont des lettres, les positions trois a huit des lettres ou des chiffres et la position neuf un chiffre, et que la lettre O n'est jamais utilisee pour eviter la confusion avec le chiffre zero ; le chiffre zero lui-meme a disparu des documents emis depuis decembre 2019, mais les documents anciens en portent encore, donc il reste accepte ici. Purview se contente de neuf caracteres alphanumeriques, ce qui reconnaitrait n'importe quel jeton de neuf caracteres, donc la lecture de l'autorite est preferee. Aucun label du registre ne s'est declenche sur les exemples."

[[examples.match]]
text = "Het documentnummer BK12AB345 staat naast de naam."
value = "BK12AB345"

[[examples.match]]
text = "The travel document NX9F2C7J8 was replaced last year."
value = "NX9F2C7J8"

[[examples.no_match]]
text = "OK12AB345"

[[examples.no_match]]
text = "BK12AB34"

[[examples.no_match]]
text = "bk12ab345"

[redos]
prefix = ""
filler = "BK12AB34"
suffix = "!"
